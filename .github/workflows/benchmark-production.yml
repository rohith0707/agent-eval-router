name: Production benchmark evidence

on:
  workflow_dispatch: # Production benchmark is intentionally manual-only.

jobs:
  benchmark-production:
    if: github.repository == 'rohith0707/agent-eval-router'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate workflow contract
        run: |
          node <<'NODE'
          const fs = require('fs');
          const workflow = fs.readFileSync('.github/workflows/benchmark-production.yml', 'utf8');
          if (!workflow.includes('workflow_dispatch:')) throw new Error('workflow_dispatch trigger is required');
          if (workflow.includes('deployment_status:')) throw new Error('deployment_status trigger must remain disabled');
          if (workflow.includes('github.event.deployment_status')) throw new Error('deployment-status event references are not allowed');
          if (!workflow.includes('VERCEL_AUTOMATION_BYPASS_SECRET')) throw new Error('Vercel bypass secret contract missing');
          if (!workflow.includes('POST') || !workflow.includes('/api/benchmark')) throw new Error('benchmark POST contract missing');
          if (!workflow.includes('for start in 0 5 10 15 20 25 30 35 40 45')) throw new Error('10 bounded batches required');
          if (!workflow.includes('Expected 10 benchmark batches')) throw new Error('aggregate batch contract missing');
          if (!workflow.includes('Expected 50 accounted cases')) throw new Error('50-case accounting contract missing');
          if (!workflow.includes('Expected 50 unique case IDs')) throw new Error('unique case contract missing');
          if (!workflow.includes('Expected 50 evaluated cases')) throw new Error('evaluation completeness contract missing');
          if (!workflow.includes('upload-artifact@v4')) throw new Error('raw evidence artifact contract missing');
          console.log('[production-benchmark-workflow] PASS manual-only + bounded 10-batch benchmark');
          NODE
      - name: Validate production-readiness contract
        run: node scripts/check-production-readiness.mjs
      - name: Resolve deployment URL
        env:
          MANUAL_BASE_URL: ${{ vars.PRODUCTION_BENCHMARK_BASE_URL }}
        run: |
          set -euo pipefail
          BASE_URL="${MANUAL_BASE_URL:-https://agent-eval-router.vercel.app}"
          case "$BASE_URL" in
            https://*.vercel.app|https://*.vercel.sh) ;;
            *) echo "Unsupported benchmark target: $BASE_URL" >&2; exit 1;;
          esac
          echo "BASE_URL=$BASE_URL" >> "$GITHUB_ENV"
          echo "Benchmark target: $BASE_URL"
      - name: Run 50-case production benchmark in bounded batches
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "$VERCEL_AUTOMATION_BYPASS_SECRET" ]; then
            echo "VERCEL_AUTOMATION_BYPASS_SECRET is not configured in GitHub Actions." >&2
            exit 1
          fi
          rm -rf benchmark-results && mkdir -p benchmark-results
          for start in 0 5 10 15 20 25 30 35 40 45; do
            if [ "$start" != "0" ]; then
              echo "Throttling to respect provider rate limits..."
              sleep 8
            fi
            end=$((start + 4))
            echo "Running benchmark batch ${start}-${end}"
            status=$(curl --silent --show-error --output "benchmark-results/batch-${start}.json" --write-out '%{http_code}' \
              --request POST \
              --header 'Content-Type: application/json' \
              --header "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" \
              --max-time 50 "$BASE_URL/api/benchmark?start=${start}&limit=5")
            echo "HTTP status: $status"
            cat "benchmark-results/batch-${start}.json"
            if [ "$status" = "200" ]; then
              echo "Batch ${start}-${end} OK (status=${status})"
            else
              echo "Batch ${start}-${end} FAILED (status=${status}) — retrying with backoff..."
              sleep 10
              status_retry=$(curl --silent --show-error --output "benchmark-results/batch-${start}-retry.json" --write-out '%{http_code}' \
                --request POST \
                --header 'Content-Type: application/json' \
                --max-time 60 "$BASE_URL/api/benchmark?start=${start}&limit=5")
              echo "Retry status: $status_retry"
              if [ "$status_retry" = "200" ]; then
                mv "benchmark-results/batch-${start}-retry.json" "benchmark-results/batch-${start}.json"
              else
                echo "Even retry failed — marking batch as degraded."
              fi
            fi
            node - "benchmark-results/batch-${start}.json" <<'NODE'
          const fs = require('fs');
          const path = process.argv[2];
          const result = JSON.parse(fs.readFileSync(path, 'utf8'));
          if (result.error) throw new Error(result.error);
          if (result.batch?.limit !== 5) throw new Error(`Expected batch size 5, got ${result.batch?.limit}`);
          if (!Array.isArray(result.results) || result.results.length !== 5) throw new Error(`Expected 5 results, got ${result.results?.length}`);
          const ids = new Set(result.results.map((item) => item.id));
          if (ids.size !== 5) throw new Error('Batch contains duplicate case IDs');
          console.log(JSON.stringify({batch: result.batch, summary: result.summary, providerMix: result.providerMix}, null, 2));
          NODE
          done
      - name: Validate aggregated measured evidence
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const files = fs.readdirSync('benchmark-results').filter((name) => name.endsWith('.json')).sort((a, b) => Number(a.match(/(\d+)/)[1]) - Number(b.match(/(\d+)/)[1]));
          if (files.length !== 10) throw new Error(`Expected 10 benchmark batches; got ${files.length}`);
          const all = files.map((file) => JSON.parse(fs.readFileSync(`benchmark-results/${file}`, 'utf8')));
          const results = all.flatMap((result) => result.results ?? []);
          const ids = new Set(results.map((item) => item.id));
          const evaluated = results.filter((item) => item.status !== 'infra_failed').length;
          const infraFailed = results.filter((item) => item.status === 'infra_failed').length;
          if (results.length !== 50) throw new Error(`Expected 50 accounted cases; got ${results.length}`);
          if (ids.size !== 50) throw new Error(`Expected 50 unique case IDs; got ${ids.size}`);
          if (evaluated !== 50) throw new Error(`Expected 50 evaluated cases; got ${evaluated}; infra_failed=${infraFailed}`);
          const passed = results.filter((item) => item.status === 'passed');
          const measured = {
            cases: results.length,
            evaluated,
            passed: passed.length,
            failed: results.filter((item) => item.status === 'failed').length,
            infraFailed,
            averageQuality: results.reduce((sum, item) => sum + Number(item.quality || 0), 0) / results.length,
            averageLatencyMs: results.filter((item) => item.latencyMs != null).reduce((sum, item) => sum + item.latencyMs, 0) / results.filter((item) => item.latencyMs != null).length,
            fallbackRate: results.filter((item) => item.fallbacks > 0).length / results.length,
          };
          fs.writeFileSync('benchmark-results/production-benchmark.json', JSON.stringify({suite: all[0].suite, graderVersion: all[0].graderVersion, measured, batches: all.map((item) => ({batch: item.batch, summary: item.summary, providerMix: item.providerMix}))}, null, 2));
          console.log(JSON.stringify(measured, null, 2));
          NODE
      - name: Upload raw evidence
        uses: actions/upload-artifact@v4
        with:
          name: production-benchmark-evidence
          path: benchmark-results/
          retention-days: 7
