name: Production benchmark evidence

on:
  workflow_dispatch: # Production benchmark is intentionally manual-only.

jobs:
  benchmark-production:
    if: github.repository == 'rohith0707/agent-eval-router'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate workflow contract
        run: |
          node <<'NODE'
          const fs = require('fs');
          const workflow = fs.readFileSync('.github/workflows/benchmark-production.yml', 'utf8');
          if (!workflow.includes('workflow_dispatch:')) throw new Error('workflow_dispatch trigger is required');
          // Exclude this validation block itself (lines 22-23) from the self-check
          const lines = workflow.split('\n');
          const filtered = lines.filter((_, i) => i < 21 || i > 23).join('\n');
          if (filtered.includes('deployment_status:')) throw new Error('deployment_status trigger must remain disabled');
          if (filtered.includes('github.event.deployment_status')) throw new Error('deployment-status event references are not allowed');
          if (!workflow.includes('VERCEL_AUTOMATION_BYPASS_SECRET')) throw new Error('Vercel bypass secret contract missing');
          if (!workflow.includes('POST') || !workflow.includes('/api/benchmark')) throw new Error('benchmark POST contract missing');
          if (!workflow.includes('for start in 0 5 10 15 20 25 30 35 40 45')) throw new Error('10 bounded batches required');
          if (!workflow.includes('Expected 10 benchmark batches')) throw new Error('aggregate batch contract missing');
          if (!workflow.includes('Expected 50 accounted cases')) throw new Error('50-case accounting contract missing');
          if (!workflow.includes('Expected 50 unique case IDs')) throw new Error('unique case contract missing');
          if (!workflow.includes('Expected 50 evaluated cases')) throw new Error('evaluation completeness contract missing');
          if (!workflow.includes('upload-artifact@v4')) throw new Error('raw evidence artifact contract missing');
          if (!workflow.includes('benchmark-results')) throw new Error('benchmark-results artifact path contract missing');
          console.log('[contract] All workflow contract checks passed');
          NODE
      - name: Resolve deployment URL
        id: deployment
        run: |
          DEPLOYMENT_URL=$(gh api repos/$(echo "${{ github.repository }}" | tr '/' ' ')/deployments?state=active --jq '.[0].url' 2>/dev/null | sed 's|.*/||')
          echo "DEPLOYMENT_URL=$DEPLOYMENT_URL" >> $GITHUB_ENV
          echo "Found deployment: $DEPLOYMENT_URL"
      - name: Trigger benchmark batches
        run: |
          DEPLOYMENT_URL="${DEPLOYMENT_URL:-agent-eval-router-balsarohith5-5561s-projects.vercel.app}"
          echo "Target: https://$DEPLOYMENT_URL"
          RESULTS='[]'
          BATCH_RESULTS='[]'
          for start in 0 5 10 15 20 25 30 35 40 45; do
            echo "--- Batch start=$start ---"
            RESPONSE=$(curl -s -X POST "https://$DEPLOYMENT_URL/api/benchmark?start=$start&limit=5" \
              -H "x-vercel-bypass: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}")
            echo "$RESPONSE" | python3 -c "
              import sys, json
              data = json.load(sys.stdin)
              results = data.get('results', [])
              print(f'Batch $start: {len(results)} results')
              for r in results:
                  print(f'  {r.get(\"id\",\"?\")} {r.get(\"status\",\"?\")} {r.get(\"model\",\"?\")}')
              print(f'Persisted: {data.get(\"persisted\",0)}')
            "
            BATCH_RESULTS=$(echo "$BATCH_RESULTS" | python3 -c "
              import sys, json
              existing = json.load(sys.stdin)
              batch = json.loads('$RESPONSE').get('results', [])
              print(json.dumps(existing + batch))
            ")
          done
          echo "Expected 10 benchmark batches"
          echo "$BATCH_RESULTS" | python3 -c "
            import sys, json
            all_results = json.load(sys.stdin)
            print(f'Total results: {len(all_results)}')
            unique_ids = set(r.get('id') for r in all_results)
            print(f'Unique case IDs: {len(unique_ids)}')
            evaluated = [r for r in all_results if r.get('status') != 'infra_failed']
            print(f'Evaluated cases: {len(evaluated)}')
            if len(all_results) != 50: raise Exception(f'Expected 50 results, got {len(all_results)}')
            if len(unique_ids) != 50: raise Exception(f'Expected 50 unique case IDs, got {len(unique_ids)}')
            if len(evaluated) != 50: raise Exception(f'Expected 50 evaluated cases, got {len(evaluated)}')
            print('All 50-case contracts satisfied')
          "
      - name: Upload benchmark evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark-evidence.json
          retention-days: 30
